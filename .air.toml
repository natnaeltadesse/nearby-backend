root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  delay = 300
  exclude_dir = ["tmp", "bin", "migrations", "scripts", "api", ".git"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "sql", "yaml"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = 2000

[log]
  time = true

[misc]
  clean_on_exit = true
