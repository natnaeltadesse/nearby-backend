version: "2"
sql:
  - engine: postgresql
    # goose migrations double as the schema: one source of truth.
    schema: migrations
    queries: internal/db/query
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # uuid.UUID everywhere beats pgtype.UUID's Bytes/Valid pair.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
